<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Select Business - Assistify</title>
    <style>
        :root { --accent: #10a37f; --bg: #232323; --panel: #2b2b2b; --light: #fff; --muted: #9ca3af; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--light); margin: 0; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--panel); border-radius: 12px; padding: 24px; }
        h1 { color: var(--accent); margin-top: 0; }
        .card { background: #202020; border-radius: 10px; padding: 16px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .muted { color: var(--muted); font-size: 0.9em; }
        button, .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        button.secondary { background: #444; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { font-size: 0.85em; padding: 4px 8px; border-radius: 6px; background: #333; }
        .status.approved { background: #1f4d3a; }
        .status.pending { background: #4d3a1f; }
        .status.rejected, .status.revoked { background: #4d1f1f; }
    </style>
    <script src="/static/security.js"></script>
</head>
<body>
    <div class="container">
        <h1>Choose a Business</h1>
        <p class="muted">Request access to a business or switch between businesses you already belong to.</p>
        <div id="memberships"></div>
        <h2>Available Businesses</h2>
        <div id="businesses"></div>
        <p style="margin-top:24px"><a class="btn secondary" href="/logout">Logout</a></p>
    </div>
    <script>
        function csrf() {
            return (window.Security && Security.getCSRFToken()) || '';
        }

        async function loadData() {
            try {
                const [bizRes, memRes] = await Promise.all([
                    fetch('/api/businesses', { credentials: 'same-origin' }),
                    fetch('/api/my-memberships', { credentials: 'same-origin' })
                ]);
                if (!bizRes.ok) {
                    alert(await Security.parseApiError(bizRes));
                    return;
                }
                if (!memRes.ok) {
                    alert(await Security.parseApiError(memRes));
                    return;
                }
                const businesses = await bizRes.json();
                const memberships = (await memRes.json()).memberships || [];
                const memByTenant = Object.fromEntries(memberships.map(m => [m.tenant_id, m]));
                const memEl = document.getElementById('memberships');
                const approved = memberships.filter(m => m.status === 'approved');
                if (!approved.length) {
                    memEl.innerHTML = '<p class="muted">You do not have approved access yet. Request access below.</p>';
                } else {
                    memEl.innerHTML = approved.map(m => `
                        <div class="card">
                            <div>
                                <strong>${m.tenant_name}</strong>
                                <div class="muted">Approved access</div>
                            </div>
                            <button onclick="activateTenant(${m.tenant_id})">Use this business</button>
                        </div>
                    `).join('');
                }
                document.getElementById('businesses').innerHTML = businesses.map(b => {
                    const m = memByTenant[b.id];
                    const status = m ? m.status : 'none';
                    let action = `<button onclick="requestAccess(${b.id})">Request access</button>`;
                    if (status === 'pending') action = '<span class="status pending">Pending approval</span>';
                    if (status === 'approved') action = `<button onclick="activateTenant(${b.id})">Open chat</button>`;
                    if (status === 'rejected' || status === 'revoked') action = `<button onclick="requestAccess(${b.id})">Request again</button>`;
                    return `<div class="card"><div><strong>${b.name}</strong><div class="muted">${b.slug}</div></div>${action}</div>`;
                }).join('');
            } catch (err) {
                alert('Could not load businesses: ' + (err.message || err));
            }
        }

        async function requestAccess(tenantId) {
            try {
                const res = await fetch('/api/access-requests', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
                    body: JSON.stringify({ tenant_id: tenantId })
                });
                if (!res.ok) {
                    alert(await Security.parseApiError(res));
                    return;
                }
                await loadData();
            } catch (err) {
                alert('Request failed: ' + (err.message || err));
            }
        }

        async function activateTenant(tenantId) {
            try {
                const res = await fetch('/api/session/active-tenant', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
                    body: JSON.stringify({ tenant_id: tenantId })
                });
                if (!res.ok) {
                    alert(await Security.parseApiError(res));
                    return;
                }
                window.location.href = '/main';
            } catch (err) {
                alert('Could not switch business: ' + (err.message || err));
            }
        }

        loadData();
    </script>
</body>
</html>
