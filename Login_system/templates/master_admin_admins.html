<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Manage Admins - Master Admin</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% include "_nav_shell.html" %}
    <style>
        :root { --accent: #10a37f; --bg: #232323; --panel: #2b2b2b; --light: #fff; --muted: #9ca3af; --danger: #ff7979; }
        body { background: var(--bg); color: var(--light); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
        .container { max-width: 1100px; margin: 24px auto; background: var(--panel); border-radius: 12px; padding: 24px; }
        h1 { color: var(--accent); margin-top: 0; }
        input, button { padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #171717; color: #fff; margin: 4px 0; }
        button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; }
        button.danger { background: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 10px; border-bottom: 1px solid #333; text-align: left; }
        th { color: var(--accent); }
        .form-row { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.9em; }
    </style>
    <script src="/static/security.js"></script>
</head>
<body>
<div class="container">
    <h1>Manage Normal Admins</h1>
    <p class="muted">Create and manage admin accounts for your business. Master admins are assigned by the platform owner.</p>

    <h2>Invite Admin</h2>
    <form id="createAdminForm">
        <div class="form-row"><label>Username</label><input id="username" required></div>
        <div class="form-row"><label>Password (min 8 chars)</label><input id="password" type="password" minlength="8" required></div>
        <div class="form-row"><label>Full name</label><input id="full_name"></div>
        <div class="form-row"><label>Email</label><input id="email" type="email"></div>
        <button type="submit">Create Admin</button>
    </form>

    <h2>Current Admins</h2>
    <table>
        <thead><tr><th>Username</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="adminsBody"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
</div>
<script>
    function getCookie(name) {
        const v = `; ${document.cookie}`;
        const parts = v.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    const csrf = getCookie('csrf_token');

    async function loadAdmins() {
        const tbody = document.getElementById('adminsBody');
        try {
            const res = await fetch('/api/tenant-admins', { credentials: 'same-origin', headers: { 'x-csrf-token': csrf } });
            const admins = await res.json();
            if (!res.ok) throw new Error(admins.detail || 'Failed to load');
            if (!admins.length) {
                tbody.innerHTML = '<tr><td colspan="4">No normal admins yet.</td></tr>';
                return;
            }
            tbody.innerHTML = admins.map(a => `
                <tr>
                    <td>${a.username}</td>
                    <td>${a.email || '-'}</td>
                    <td>${a.active ? 'Active' : 'Inactive'}</td>
                    <td>
                        <button type="button" onclick="toggleActive(${a.id}, ${a.active ? 'false' : 'true'}, '${a.username}')">${a.active ? 'Deactivate' : 'Activate'}</button>
                        <button type="button" class="danger" onclick="deleteAdmin(${a.id}, '${a.username}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:#ff7979">${e.message}</td></tr>`;
        }
    }

    document.getElementById('createAdminForm').onsubmit = async (e) => {
        e.preventDefault();
        const body = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            full_name: document.getElementById('full_name').value.trim(),
            email: document.getElementById('email').value.trim(),
        };
        const res = await fetch('/api/tenant-admins/create', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail || 'Create failed');
        alert('Admin created');
        e.target.reset();
        loadAdmins();
    };

    async function toggleActive(id, active, username) {
        const res = await fetch(`/api/tenant-admins/${id}`, {
            method: 'PATCH',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
            body: JSON.stringify({ active: active === 'true' || active === true }),
        });
        if (!res.ok) {
            const data = await res.json();
            return alert(data.detail || 'Update failed');
        }
        loadAdmins();
    }

    async function deleteAdmin(id, username) {
        if (!confirm(`Delete admin "${username}"?`)) return;
        const res = await fetch(`/api/tenant-admins/${id}`, {
            method: 'DELETE',
            credentials: 'same-origin',
            headers: { 'x-csrf-token': csrf },
        });
        if (!res.ok) {
            const data = await res.json();
            return alert(data.detail || 'Delete failed');
        }
        loadAdmins();
    }

    loadAdmins();
</script>
</body>
</html>
