<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Super Admin - Assistify</title>
    <style>
        :root { --accent: #10a37f; --bg: #232323; --panel: #2b2b2b; --light: #fff; --muted: #9ca3af; --danger: #c44; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--light); margin: 0; padding: 24px; }
        .container { max-width: 1100px; margin: 0 auto; background: var(--panel); border-radius: 12px; padding: 24px; }
        h1 { color: var(--accent); margin-top: 0; }
        h3 { margin: 0 0 8px; color: var(--light); }
        input, select { background: #171717; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; margin: 4px 0; width: 100%; max-width: 320px; }
        button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; margin-top: 8px; }
        button.secondary { background: #444; }
        .card { background: #202020; border-radius: 10px; padding: 16px; margin: 12px 0; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
        .muted { color: var(--muted); font-size: 0.9em; }
        .summary-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        .summary-item { background: #1a1a1a; border-radius: 8px; padding: 12px 16px; min-width: 140px; }
        .summary-item strong { display: block; font-size: 1.4em; color: var(--accent); }
        .tenant-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8em; font-weight: 600; }
        .badge.active { background: #1f4d3a; color: #a7f3d0; }
        .badge.inactive { background: #4d1f1f; color: #fca5a5; }
        .details-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 16px; margin: 12px 0; font-size: 0.9em; }
        .details-grid dt { color: var(--muted); margin: 0; }
        .details-grid dd { margin: 2px 0 0; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
        .chip { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; font-size: 0.85em; }
        .chip.pending { border-color: #b45309; color: #fcd34d; }
        .chip.approved { border-color: #047857; color: #6ee7b7; }
        .chip.rejected { border-color: #991b1b; color: #fca5a5; }
        .chip.revoked { border-color: #6b7280; color: #d1d5db; }
        .section { margin: 12px 0; border-top: 1px solid #333; padding-top: 10px; }
        .section-toggle { background: none; border: none; color: var(--accent); padding: 0; margin: 0; font-weight: 600; cursor: pointer; font-size: 0.95em; text-align: left; }
        .section-toggle:hover { text-decoration: underline; }
        .user-table { width: 100%; border-collapse: collapse; font-size: 0.88em; margin-top: 8px; }
        .user-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #333; }
        .user-table td { padding: 6px 8px; border-bottom: 1px solid #2a2a2a; }
        .user-table tr:last-child td { border-bottom: none; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        .status-dot.on { background: #10a37f; }
        .status-dot.off { background: #666; }
        .empty-msg { color: var(--muted); font-size: 0.88em; margin: 6px 0; font-style: italic; }
        .section-body { margin-top: 6px; }
        .section-body.collapsed { display: none; }
        .btn-sm { padding: 4px 10px; font-size: 0.82em; margin-top: 0; margin-right: 6px; }
        button.danger { background: var(--danger); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #2b2b2b; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; border: 1px solid #444; }
        .modal h3 { margin-top: 0; }
        .modal label { display: block; margin-top: 12px; color: var(--muted); font-size: 0.9em; }
        .modal input[type="text"], .modal input[type="email"], .modal input[type="password"] { max-width: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .readonly-field { color: var(--muted); padding: 8px 0; }
    </style>
    <script src="/static/security.js"></script>
    {% include "_nav_shell.html" %}
</head>
<body>
    <div class="container">
        <h1>Platform Super Admin</h1>
        <p class="muted">Manage businesses, assign master admins, and monitor the platform.</p>
        <div id="summary" class="summary-bar"></div>
        <div class="card">
            <h3>Create Business</h3>
            <div class="row">
                <div><label>Name</label><input id="tenantName" placeholder="Acme Corp"></div>
                <div><label>Slug</label><input id="tenantSlug" placeholder="acme-corp"></div>
                <div><button onclick="createTenant()">Create</button></div>
            </div>
        </div>
        <div id="tenants"></div>
        <p><a href="/logout" style="color:var(--accent)">Logout</a></p>
    </div>
    <div id="editAdminModal" class="modal-overlay" onclick="if (event.target === this) closeEditAdminModal()">
        <div class="modal" role="dialog" aria-labelledby="editAdminTitle">
            <h3 id="editAdminTitle">Edit admin</h3>
            <p class="muted" style="margin:0">Username</p>
            <div id="editAdminUsername" class="readonly-field"></div>
            <label for="editAdminFullName">Full name</label>
            <input id="editAdminFullName" type="text" placeholder="Full name">
            <label for="editAdminEmail">Email</label>
            <input id="editAdminEmail" type="email" placeholder="Email">
            <label for="editAdminPassword">New password (leave blank to keep)</label>
            <input id="editAdminPassword" type="password" placeholder="Optional">
            <label style="margin-top:14px">
                <input id="editAdminActive" type="checkbox"> Active
            </label>
            <div class="modal-actions">
                <button type="button" onclick="saveEditAdmin()">Save</button>
                <button type="button" class="secondary" onclick="closeEditAdminModal()">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        let tenantList = [];
        let editAdminState = null;

        function csrf() {
            return (window.Security && Security.getCSRFToken()) || '';
        }

        function apiHeaders(json) {
            const headers = { 'X-CSRF-Token': csrf() };
            if (json) headers['Content-Type'] = 'application/json';
            return headers;
        }

        async function superadminRequest(path, options = {}) {
            const wantsJson = options.json === true;
            const headers = options.headers || apiHeaders(wantsJson);
            const fetchOptions = {
                method: options.method || 'GET',
                credentials: 'same-origin',
                headers,
            };
            if (options.body !== undefined) {
                fetchOptions.body = wantsJson ? JSON.stringify(options.body) : options.body;
            }

            const res = await fetch(path, fetchOptions);
            if (res.status === 401 || res.status === 403) {
                const reason = await parseApiErrorMessage(res);
                alert(`Authentication expired: ${reason}. Please log in again.`);
                window.location.href = '/login';
                return null;
            }
            return res;
        }

        function escapeHtml(value) {
            if (value == null) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(value) {
            if (!value) return '—';
            const d = new Date(value);
            return isNaN(d.getTime()) ? escapeHtml(value) : d.toLocaleString();
        }

        function activeLabel(active) {
            return active
                ? '<span class="status-dot on"></span>Active'
                : '<span class="status-dot off"></span>Inactive';
        }

        function renderUserTable(users, emptyText, tenantId) {
            if (!users || !users.length) {
                return `<p class="empty-msg">${escapeHtml(emptyText)}</p>`;
            }
            const showActions = tenantId != null;
            const rows = users.map(u => {
                const actions = showActions ? `
                    <td>
                        <button type="button" class="secondary btn-sm" data-action="edit-admin" data-tenant-id="${tenantId}" data-user-id="${u.id}">Edit</button>
                        <button type="button" class="danger btn-sm" data-action="delete-admin" data-tenant-id="${tenantId}" data-user-id="${u.id}">Delete</button>
                    </td>` : '';
                return `
                <tr>
                    <td>${escapeHtml(u.username)}</td>
                    <td>${escapeHtml(u.full_name || '—')}</td>
                    <td>${escapeHtml(u.email || '—')}</td>
                    <td>${u.active ? 'Yes' : 'No'}</td>
                    ${actions}
                </tr>`;
            }).join('');
            const actionHeader = showActions ? '<th>Actions</th>' : '';
            return `<table class="user-table">
                <thead><tr><th>Username</th><th>Full name</th><th>Email</th><th>Active</th>${actionHeader}</tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
        }

        function renderCustomerTable(customers) {
            if (!customers || !customers.length) {
                return '<p class="empty-msg">No approved membership customers yet.</p>';
            }
            const rows = customers.map(u => `
                <tr>
                    <td>${escapeHtml(u.username)}</td>
                    <td>${escapeHtml(u.full_name || '—')}</td>
                    <td>${escapeHtml(u.email || '—')}</td>
                    <td>${formatDate(u.approved_at)}</td>
                    <td>${u.active ? 'Yes' : 'No'}</td>
                </tr>
            `).join('');
            return `<table class="user-table">
                <thead><tr><th>Username</th><th>Full name</th><th>Email</th><th>Approved</th><th>Active</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
        }

        function renderSection(tenantId, key, title, count, bodyHtml, expanded) {
            const bodyId = `section_${tenantId}_${key}`;
            const collapsed = expanded ? '' : ' collapsed';
            const arrow = expanded ? '▼' : '▶';
            return `
                <div class="section">
                    <button type="button" class="section-toggle" onclick="toggleSection('${bodyId}', this)">
                        ${arrow} ${escapeHtml(title)} (${count})
                    </button>
                    <div id="${bodyId}" class="section-body${collapsed}">${bodyHtml}</div>
                </div>
            `;
        }

        function toggleSection(bodyId, btn) {
            const body = document.getElementById(bodyId);
            if (!body) return;
            const collapsed = body.classList.toggle('collapsed');
            const label = btn.textContent.replace(/^[▶▼]\s*/, '');
            btn.textContent = (collapsed ? '▶ ' : '▼ ') + label;
        }

        function renderSummary(tenants) {
            const totalUsers = tenants.reduce((sum, t) => sum + (t.user_count || 0), 0);
            const pending = tenants.reduce((sum, t) => sum + ((t.membership_stats && t.membership_stats.pending) || 0), 0);
            document.getElementById('summary').innerHTML = `
                <div class="summary-item"><span class="muted">Businesses</span><strong>${tenants.length}</strong></div>
                <div class="summary-item"><span class="muted">Total users</span><strong>${totalUsers}</strong></div>
                <div class="summary-item"><span class="muted">Pending access requests</span><strong>${pending}</strong></div>
            `;
        }

        function renderTenantCard(t) {
            const stats = t.membership_stats || {};
            const masterAdmins = t.master_admins || [];
            const masterCount = masterAdmins.length;
            const admins = t.admins || [];
            const adminCount = admins.length;
            const employees = t.employees || [];
            const customers = t.membership_customers || [];
            const rc = t.role_counts || {};
            const hasMaster = masterCount > 0;

            return `
                <div class="card">
                    <div class="tenant-header">
                        <div>
                            <strong style="font-size:1.15em">${escapeHtml(t.name)}</strong>
                            <span class="muted"> (${escapeHtml(t.slug)})</span>
                        </div>
                        <span class="badge ${t.active ? 'active' : 'inactive'}">${t.active ? 'Active' : 'Inactive'}</span>
                    </div>
                    <dl class="details-grid">
                        <div><dt>Tenant ID</dt><dd>${t.id}</dd></div>
                        <div><dt>Plan</dt><dd>${escapeHtml(t.plan || 'standard')}</dd></div>
                        <div><dt>Created</dt><dd>${formatDate(t.created_at)}</dd></div>
                        <div><dt>Total users</dt><dd>${t.user_count || 0}</dd></div>
                        <div><dt>Staff breakdown</dt><dd>${rc.master_admin || 0} master admin, ${rc.admin || 0} admins, ${rc.employee || 0} employees, ${rc.customer || 0} customers</dd></div>
                        <div><dt>Master admin</dt><dd>${hasMaster ? 'Assigned' : 'Not assigned'}</dd></div>
                    </dl>
                    <div class="chips">
                        <span class="chip pending">Pending: ${stats.pending || 0}</span>
                        <span class="chip approved">Approved: ${stats.approved || 0}</span>
                        <span class="chip rejected">Rejected: ${stats.rejected || 0}</span>
                        <span class="chip revoked">Revoked: ${stats.revoked || 0}</span>
                    </div>
                    ${renderSection(t.id, 'master_admins', 'Master Admin', masterCount,
                        renderUserTable(masterAdmins, 'No master admin — assign one below.', t.id), true)}
                    ${renderSection(t.id, 'admins', 'Normal Admins (read-only)', adminCount,
                        renderUserTable(admins, 'Normal admins are managed by the master admin.', null), false)}
                    ${renderSection(t.id, 'employees', 'Employees', employees.length,
                        renderUserTable(employees, 'No employees for this business.'), false)}
                    ${renderSection(t.id, 'customers', 'Approved customers', customers.length,
                        renderCustomerTable(customers), false)}
                    <div class="row" style="margin-top:12px">
                        <input id="adminUser_${t.id}" placeholder="Master admin username" ${hasMaster ? 'disabled' : ''}>
                        <input id="adminFullName_${t.id}" placeholder="Full name" ${hasMaster ? 'disabled' : ''}>
                        <input id="adminEmail_${t.id}" type="email" placeholder="Email" ${hasMaster ? 'disabled' : ''}>
                        <input id="adminPass_${t.id}" type="password" placeholder="Password" ${hasMaster ? 'disabled' : ''}>
                        <button onclick="createManager(${t.id})" ${hasMaster ? 'disabled' : ''}>Add master admin</button>
                        <button class="secondary" onclick="toggleTenant(${t.id}, '${t.active ? 'false' : 'true'}')">${t.active ? 'Deactivate' : 'Activate'}</button>
                    </div>
                    <p class="muted" style="margin:8px 0 0">One master admin per tenant. Normal admins are created by the master admin.</p>
                </div>
            `;
        }

        async function loadTenants() {
            try {
                const res = await superadminRequest('/api/tenants');
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    return;
                }
                tenantList = await res.json();
                renderSummary(tenantList);
                document.getElementById('tenants').innerHTML = tenantList.map(renderTenantCard).join('');
            } catch (err) {
                alert('Could not load businesses: ' + (err.message || err));
            }
        }

        async function createTenant() {
            const name = document.getElementById('tenantName').value.trim();
            const slug = document.getElementById('tenantSlug').value.trim().toLowerCase();
            if (!name || !slug) {
                alert('Name and slug are required.');
                return;
            }
            if (tenantList.some(t => t.slug === slug)) {
                alert(`Business with slug "${slug}" already exists.`);
                return;
            }
            try {
                const res = await superadminRequest('/api/tenants/create', {
                    method: 'POST',
                    json: true,
                    body: { name, slug }
                });
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    return;
                }
                document.getElementById('tenantName').value = '';
                document.getElementById('tenantSlug').value = '';
                alert('Business created');
                loadTenants();
            } catch (err) {
                alert('Create failed: ' + (err.message || err));
            }
        }

        async function createManager(tenantId) {
            const username = document.getElementById('adminUser_' + tenantId).value.trim();
            const fullName = document.getElementById('adminFullName_' + tenantId).value.trim();
            const email = document.getElementById('adminEmail_' + tenantId).value.trim();
            const password = document.getElementById('adminPass_' + tenantId).value;
            if (!username || !password) {
                alert('Username and password are required.');
                return;
            }
            if (email && window.Security && !Security.isValidEmail(email)) {
                alert('Please enter a valid email address.');
                return;
            }
            const payload = { username, password };
            if (fullName) payload.full_name = fullName;
            if (email) payload.email = email;
            try {
                const res = await superadminRequest('/api/tenants/' + tenantId + '/managers', {
                    method: 'POST',
                    json: true,
                    body: payload
                });
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    return;
                }
                alert('Master admin created');
                document.getElementById('adminUser_' + tenantId).value = '';
                document.getElementById('adminFullName_' + tenantId).value = '';
                document.getElementById('adminEmail_' + tenantId).value = '';
                document.getElementById('adminPass_' + tenantId).value = '';
                loadTenants();
            } catch (err) {
                alert('Add master admin failed: ' + (err.message || err));
            }
        }

        async function toggleTenant(tenantId, activate) {
            const shouldActivate = activate === true || activate === 'true';
            const path = shouldActivate ? 'activate' : 'deactivate';
            try {
                const res = await superadminRequest('/api/tenants/' + tenantId + '/' + path, {
                    method: 'POST'
                });
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    return;
                }
                loadTenants();
            } catch (err) {
                alert('Update failed: ' + (err.message || err));
            }
        }

        async function toggleMultiAdmin(tenantId, enabled) {
            try {
                const res = await superadminRequest('/api/tenants/' + tenantId + '/settings', {
                    method: 'POST',
                    json: true,
                    body: { allow_multiple_admins: enabled }
                });
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    loadTenants();
                }
            } catch (err) {
                alert('Settings update failed: ' + (err.message || err));
                loadTenants();
            }
        }

        function findAdminInTenant(tenantId, userId) {
            const tenant = tenantList.find(t => t.id === tenantId);
            if (!tenant || !tenant.master_admins) return null;
            return tenant.master_admins.find(a => a.id === userId) || null;
        }

        function parseApiErrorMessage(res) {
            if (window.Security && typeof Security.parseApiError === 'function') {
                return Security.parseApiError(res);
            }
            return res.statusText || `Request failed (${res.status})`;
        }

        document.getElementById('tenants').addEventListener('click', (event) => {
            const editBtn = event.target.closest('[data-action="edit-admin"]');
            if (editBtn) {
                openEditAdminModal(
                    Number(editBtn.dataset.tenantId),
                    Number(editBtn.dataset.userId),
                );
                return;
            }
            const deleteBtn = event.target.closest('[data-action="delete-admin"]');
            if (deleteBtn) {
                deleteAdmin(
                    Number(deleteBtn.dataset.tenantId),
                    Number(deleteBtn.dataset.userId),
                    deleteBtn,
                );
            }
        });

        function openEditAdminModal(tenantId, userId) {
            const admin = findAdminInTenant(tenantId, userId);
            if (!admin) {
                alert('Admin not found. Refresh and try again.');
                return;
            }
            editAdminState = { tenantId, userId };
            document.getElementById('editAdminUsername').textContent = admin.username;
            document.getElementById('editAdminFullName').value = admin.full_name || '';
            document.getElementById('editAdminEmail').value = admin.email || '';
            document.getElementById('editAdminPassword').value = '';
            document.getElementById('editAdminActive').checked = !!admin.active;
            document.getElementById('editAdminModal').classList.add('open');
        }

        function closeEditAdminModal() {
            editAdminState = null;
            document.getElementById('editAdminModal').classList.remove('open');
        }

        async function saveEditAdmin() {
            if (!editAdminState) return;
            const { tenantId, userId } = editAdminState;
            const fullName = document.getElementById('editAdminFullName').value.trim();
            const email = document.getElementById('editAdminEmail').value.trim();
            const password = document.getElementById('editAdminPassword').value;
            const active = document.getElementById('editAdminActive').checked;
            if (email && window.Security && !Security.isValidEmail(email)) {
                alert('Please enter a valid email address.');
                return;
            }
            if (password && password.length < 8) {
                alert('Password must be at least 8 characters.');
                return;
            }
            const payload = { full_name: fullName || null, email: email || null, active };
            if (password) payload.password = password;
            try {
                const res = await superadminRequest('/api/tenants/' + tenantId + '/managers/' + userId, {
                    method: 'PATCH',
                    json: true,
                    body: payload
                });
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    return;
                }
                closeEditAdminModal();
                loadTenants();
            } catch (err) {
                alert('Update failed: ' + (err.message || err));
            }
        }

        async function deleteAdmin(tenantId, userId, triggerBtn) {
            const admin = findAdminInTenant(tenantId, userId);
            const username = admin ? admin.username : ('user #' + userId);
            if (!confirm('Permanently delete admin "' + username + '"?')) return;

            const btn = triggerBtn || null;
            const prevText = btn ? btn.textContent : '';
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Deleting…';
            }

            try {
                const res = await superadminRequest('/api/tenants/' + tenantId + '/managers/' + userId, {
                    method: 'DELETE'
                });
                if (!res) return;
                if (!res.ok) {
                    alert(await parseApiErrorMessage(res));
                    return;
                }
                await loadTenants();
            } catch (err) {
                alert('Delete failed: ' + (err.message || err));
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = prevText;
                }
            }
        }

        loadTenants();
    </script>
</body>
</html>
