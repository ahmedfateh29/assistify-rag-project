<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="csrf-token" content="{{ csrf_token() }}">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "_nav_shell.html" %}
<title>Assistify - Main Dashboard</title>
    <style>
        :root {
            --accent: #10a37f;
            --bg: #232323;
            --sidebar: #2b2b2b;
            --light: #fff;
            --muted: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--light);
            min-height: 100vh;
            padding: 0;
        }
.panel {
            background: var(--sidebar);
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.5);
            margin: 60px auto;
        }
        h2 {
            text-align: center;
            color: var(--accent);
            font-size: 2.5rem;
            margin-bottom: 1em;
        }
        .welcome {
            font-size: 1.2em;
            text-align: center;
            margin-bottom: 2em;
            line-height: 1.8;
        }
        .welcome b {
            color: var(--accent);
        }
        .user-badge {
            display: inline-block;
            background: var(--accent);
            color: var(--light);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin: 10px 0;
        }
        .actions {
            display: grid;
            gap: 16px;
            margin-top: 32px;
        }
        .btn {
            display: block;
            text-align: center;
            background: var(--accent);
            color: var(--light);
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1em;
            transition: background 0.22s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #0d8658;
        }
        .btn-secondary {
            background: var(--muted);
        }
        .btn-secondary:hover {
            background: #6b7280;
        }
        hr {
            border: none;
            border-top: 1px solid #444;
            margin: 24px 0;
        }
        .icon {
            margin-right: 8px;
        }
    </style>
<script src="/static/security.js"></script>
</head>
<body>
<div class="panel">
        <h2>💬 Assistify Help Desk</h2>
        <div class="welcome">
            Welcome back, <b>{{ user['username'] }}</b>!
            <br>
            <span class="user-badge">{{ user['role'].upper() }}</span>
        </div>
        
        <hr>
        
        <div class="actions">
            <a href="/frontend/index.html" class="btn">
                <span class="icon">🚀</span>
                Launch Voice Chat Assistant
            </a>
            <a href="/logout" class="btn btn-secondary">
                <span class="icon">🚪</span>
                Logout
            </a>
        </div>
    </div>
    <script>
        async function initBusinessSwitcher() {
            const select = document.getElementById('businessSwitcher');
            if (!select) return;
            try {
                const res = await fetch('/api/my-memberships');
                const memberships = ((await res.json()).memberships || []).filter(m => m.status === 'approved');
                if (memberships.length < 2) return;
                select.style.display = 'block';
                select.innerHTML = memberships.map(m =>
                    `<option value="${m.tenant_id}">${m.tenant_name}</option>`
                ).join('');
                const active = {{ (user.get('active_tenant_id') or user.get('tenant_id')) | tojson }};
                if (active) select.value = String(active);
                select.addEventListener('change', async () => {
                    const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
                    await fetch('/api/session/active-tenant', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
                        body: JSON.stringify({ tenant_id: Number(select.value) })
                    });
                    window.location.reload();
                });
            } catch (e) { /* customer may not have memberships API in older sessions */ }
        }
        initBusinessSwitcher();
    </script>
</body>
</html>
